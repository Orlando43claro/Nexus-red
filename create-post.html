<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus | Crear Publicación</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* Estilos Base */
        body { font-family: sans-serif; margin: 0; background-color: #f0f2f5; display: flex; flex-direction: column; min-height: 100vh; }
        .header { background-color: #0077b6; color: white; padding: 10px; text-align: center; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { margin: 0; font-size: 1.5em; }
        .header nav { display: flex; gap: 10px; }
        .header a { color: white; text-decoration: none; padding: 5px 10px; border-radius: 5px; transition: background-color 0.3s; }
        .header a:hover { background-color: #005f93; }

        /* Contenedor Principal */
        .container { max-width: 600px; margin: 20px auto; padding: 20px; background-color: white; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); flex-grow: 1; }
        h2 { color: #0077b6; text-align: center; margin-bottom: 20px; }

        /* Formulario de Publicación */
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #333; }
        textarea, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 1em; resize: vertical; }
        textarea { height: 150px; }

        /* Estilos de Botón */
        .btn-post {
            background-color: #0077b6; color: white; padding: 12px 20px;
            border: none; border-radius: 6px; cursor: pointer; 
            font-size: 1.1em; font-weight: bold; width: 100%;
            transition: background-color 0.3s, transform 0.1s;
        }
        .btn-post:hover { background-color: #005f93; }
        .btn-post:active { transform: scale(0.99); }
        .btn-post:disabled { background-color: #999; cursor: not-allowed; }

        /* Mensajes de estado */
        .message {
            padding: 10px; border-radius: 6px; margin-top: 15px;
            text-align: center; font-weight: bold;
        }
        .message.success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .message.error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }

        /* Círculos de Influencia */
        .circles-container {
            border: 1px solid #eee; padding: 10px; border-radius: 6px;
            background-color: #f9f9f9;
        }
        .circle-item {
            display: flex; align-items: center; margin-bottom: 5px;
        }
        .circle-item input[type="radio"] { margin-right: 10px; }
        .circle-item label { font-weight: normal; margin-bottom: 0; }
    </style>
</head>
<body>

    <header class="header">
        <h1>NEXUS</h1>
        <nav>
            <a href="feed.html">Flujo</a>
            <a href="explore.html">Explorar</a>
            <a href="create-post.html" style="background-color: #005f93;">Crear</a>
            <a href="profile.html">Perfil</a>
        </nav>
    </header>

    <div class="container">
        <h2>Crear Nueva Publicación</h2>

        <div class="form-group">
            <label for="post-content">Contenido de la Publicación:</label>
            <textarea id="post-content" placeholder="¿Qué quieres compartir con Nexus?"></textarea>
        </div>

        <!-- Opciones de Círculos (Visibilidad) -->
        <div class="form-group">
            <label>Visibilidad de la Publicación:</label>
            <div id="circles-options" class="circles-container">
                <div id="loading-circles">
                    <i class="fas fa-spinner fa-spin"></i> Cargando Círculos de Influencia...
                </div>
                <!-- Opciones de círculos/privacidad se insertarán aquí -->
            </div>
        </div>

        <button class="btn-post" id="post-button" onclick="createPost()">
            <i class="fas fa-paper-plane"></i> Publicar en Nexus
        </button>

        <div id="status-message" class="message" style="display: none;"></div>
    </div>

    <!-- ****************************************************** -->
    <!-- INTEGRACIÓN CON FIREBASE Y LÓGICA DE PUBLICACIÓN -->
    <!-- ****************************************************** -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-auth.js";
        import { 
            getFirestore, collection, addDoc, serverTimestamp, query, onSnapshot, doc
        } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-firestore.js";

        // Variables Globales de Canvas (MANDATORIAS)
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : { /* Configuración de Firebase por defecto si falla */ };
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
        
        // Inicializar Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        let isUserLoggedIn = false;
        let userId = null;
        
        // Referencias a Elementos del DOM
        const postContent = document.getElementById('post-content');
        const postButton = document.getElementById('post-button');
        const statusMessage = document.getElementById('status-message');
        const circlesOptionsDiv = document.getElementById('circles-options');
        const loadingCirclesDiv = document.getElementById('loading-circles');


        // ******************************************************
        // LÓGICA DE AUTENTICACIÓN
        // ******************************************************
        async function setupAuth() {
            try {
                if (initialAuthToken) {
                    await signInWithCustomToken(auth, initialAuthToken);
                    console.log("Sesión iniciada con Custom Token.");
                } else {
                    // Si no hay token inicial, intentamos iniciar sesión anónima (aunque para crear posts, el usuario debe estar logueado)
                    await signInAnonymously(auth);
                    console.log("Sesión iniciada anónimamente.");
                }
            } catch (error) {
                console.error("Error signing in:", error);
                showStatus('Error al iniciar sesión. Recarga la página.', 'error');
                postButton.disabled = true;
            }
        }
        
        // Listener de estado de autenticación
        onAuthStateChanged(auth, (user) => {
            if (user && !user.isAnonymous) {
                isUserLoggedIn = true;
                userId = user.uid;
                postButton.disabled = false;
                setupCirclesListener();
            } else {
                isUserLoggedIn = false;
                userId = null;
                postButton.disabled = true;
                if (!auth.currentUser) {
                     showStatus('Debes <a href="login.html">iniciar sesión</a> o <a href="register.html">registrarte</a> para crear publicaciones.', 'error');
                } else if (auth.currentUser.isAnonymous) {
                    showStatus('La sesión anónima no permite crear publicaciones. <a href="login.html">Inicia Sesión</a>.', 'error');
                }
            }
        });

        // ******************************************************
        // LÓGICA DE CÍRCULOS DE INFLUENCIA
        // ******************************************************
        function setupCirclesListener() {
            if (!userId) return;

            const circlesRef = collection(db, "artifacts", appId, "users", userId, "circles");
            const q = query(circlesRef);

            onSnapshot(q, (snapshot) => {
                loadingCirclesDiv.style.display = 'none';
                circlesOptionsDiv.innerHTML = '';
                
                // 1. Opción por defecto: Global
                circlesOptionsDiv.innerHTML += `
                    <div class="circle-item">
                        <input type="radio" id="visibility-global" name="visibility" value="global" checked>
                        <label for="visibility-global"><i class="fas fa-globe"></i> Global (Público)</label>
                    </div>
                `;

                // 2. Opción: Solo yo (Privado)
                circlesOptionsDiv.innerHTML += `
                    <div class="circle-item">
                        <input type="radio" id="visibility-private" name="visibility" value="private">
                        <label for="visibility-private"><i class="fas fa-lock"></i> Solo Yo (Privado)</label>
                    </div>
                `;

                // 3. Opciones de Círculos
                if (snapshot.empty) {
                    circlesOptionsDiv.innerHTML += `<p style="margin-top: 10px; color: #555;">No tienes Círculos de Influencia creados.</p>`;
                } else {
                    snapshot.forEach((doc) => {
                        const circle = doc.data();
                        circlesOptionsDiv.innerHTML += `
                            <div class="circle-item">
                                <input type="radio" id="visibility-${doc.id}" name="visibility" value="${doc.id}">
                                <label for="visibility-${doc.id}"><i class="fas fa-users"></i> Círculo: ${circle.name}</label>
                            </div>
                        `;
                    });
                }
            }, (error) => {
                console.error("Error al cargar los círculos:", error);
                loadingCirclesDiv.textContent = 'Error al cargar círculos.';
            });
        }
        
        // ******************************************************
        // LÓGICA DE CREAR PUBLICACIÓN (EL CAMBIO CLAVE ESTÁ AQUÍ)
        // ******************************************************
        window.createPost = async function() {
            if (!isUserLoggedIn || !userId) {
                showStatus('Por favor, inicia sesión para publicar.', 'error');
                return;
            }

            const content = postContent.value.trim();
            if (content.length === 0) {
                showStatus('El contenido no puede estar vacío.', 'error');
                return;
            }
            
            const selectedVisibility = document.querySelector('input[name="visibility"]:checked')?.value || 'global';
            
            postButton.disabled = true;
            showStatus('Publicando...', 'success', true);

            try {
                // Definir la RUTA DE COLECCIÓN PÚBLICA para posts
                const postCollectionRef = collection(db, "artifacts", appId, "public", "data", "posts");
                
                // Definir los datos del post
                const postData = {
                    userId: userId,
                    content: content,
                    timestamp: serverTimestamp(),
                    likes: 0,
                    comments: 0,
                    // 'global', 'private', o el ID del círculo
                    visibility: selectedVisibility, 
                    status: 'active' 
                };

                // Guardar la publicación
                await addDoc(postCollectionRef, postData);

                showStatus('¡Publicación creada con éxito!', 'success');
                postContent.value = ''; // Limpiar el campo
                postButton.disabled = false;
                
                // Redirigir al feed
                setTimeout(() => {
                    window.location.href = 'feed.html';
                }, 1500);

            } catch (error) {
                console.error("Error al crear la publicación:", error);
                showStatus(`Error al publicar: ${error.message || 'Error desconocido'}`, 'error');
                postButton.disabled = false;
            }
        }

        // ******************************************************
        // UTILIDADES
        // ******************************************************
        function showStatus(message, type, isLoading = false) {
            statusMessage.className = `message ${type}`;
            statusMessage.innerHTML = isLoading ? 
                `<i class="fas fa-spinner fa-spin"></i> ${message}` : 
                message;
            statusMessage.style.display = 'block';
        }

        // 1. Iniciar el proceso de Autenticación
        setupAuth();

    </script>
</body>
</html>
