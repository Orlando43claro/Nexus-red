<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus | Crear Publicación</title>
    <style>
        /* Estilos Mínimos y Responsivos */
        body { 
            font-family: sans-serif; margin: 0; background-color: #f0f2f5; 
            display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; padding: 20px;
        }
        .container { 
            background-color: white; padding: 30px; border-radius: 12px; 
            max-width: 500px; width: 100%; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.1); 
            text-align: center;
        }
        h2 { color: #0077b6; margin-bottom: 20px; }
        label { display: block; margin-top: 15px; font-weight: bold; color: #333; margin-bottom: 5px; text-align: left;}
        textarea, select { 
            width: 100%; padding: 12px; margin-top: 5px; 
            border: 1px solid #ddd; border-radius: 8px; 
            box-sizing: border-box; font-size: 16px; resize: vertical;
        }
        button { 
            background-color: #0077b6; color: white; padding: 14px 20px; 
            border: none; border-radius: 8px; cursor: pointer; 
            width: 100%; margin-top: 25px; font-weight: bold; 
            transition: background-color 0.3s;
        }
        button:hover { background-color: #005f93; }
        .error-message, .success-message { 
            margin-top: 15px; font-weight: 500; text-align: center; 
        }
        .error-message { color: #d9534f; }
        .success-message { color: #28a745; }
        
        #loading-overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(255, 255, 255, 0.9);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            border-radius: 12px;
            font-weight: bold;
        }
    </style>

    <!-- 1. Carga de SDKs de Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-firestore.js";
        
        // 2. Configuración de Firebase (Tus Credenciales)
        const firebaseConfig = {
            apiKey: "AIzaSyCaJWbunJFLn2iZLopx-4bsZa0DapE8whc",
            authDomain: "nexus-2c445.firebaseapp.com",
            projectId: "nexus-2c445",
            storageBucket: "nexus-2c445.firebasestorage.app",
            messagingSenderId: "601285349766",
            appId: "1:601285349766:web:b8c014910f82ebf2c45c07"
        };

        // 3. Inicializar Firebase y Servicios
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null; 

        // Referencias a elementos del DOM
        const circlesSelect = document.getElementById('circleTarget');
        const loadingOverlay = document.getElementById('loading-overlay');
        const formContent = document.getElementById('form-content');
        const errorDisplay = document.getElementById('errorMessage');
        const successDisplay = document.getElementById('successMessage');

        // 4. Función para cargar Círculos de Influencia
        async function loadCircles(user) {
            loadingOverlay.innerHTML = 'Cargando Circles de Influencia...';
            
            try {
                // Obtener el documento del usuario desde la colección 'users'
                const userDocRef = doc(db, "users", user.uid);
                const userDoc = await getDoc(userDocRef);

                if (userDoc.exists()) {
                    const userData = userDoc.data();
                    const circles = userData.circles || [];

                    if (circles.length > 0) {
                        // Llenar el <select> con los círculos encontrados
                        circlesSelect.innerHTML = '';
                        circles.forEach(circle => {
                            const option = document.createElement('option');
                            option.value = circle.name; // Usamos el nombre del círculo como valor
                            option.textContent = circle.name;
                            circlesSelect.appendChild(option);
                        });
                        
                        // Ocultar overlay y mostrar el formulario
                        loadingOverlay.style.display = 'none';
                        formContent.style.display = 'block';

                    } else {
                        // El documento existe pero no tiene círculos
                        loadingOverlay.innerHTML = '¡Error! Necesitas crear un Círculo de Influencia. Ve a <a href="profile-setup.html" style="color:#0077b6;">Configurar Perfil</a> o <a href="manage-circles.html" style="color:#0077b6;">Gestionar Círculos</a>.';
                    }

                } else {
                    // El usuario está autenticado pero el documento no existe (No pasó por profile-setup)
                    loadingOverlay.innerHTML = '¡Error! Tu perfil no está configurado. Redirigiendo a <a href="profile-setup.html" style="color:#0077b6;">Configurar Perfil</a>...';
                    setTimeout(() => {
                        window.location.href = 'profile-setup.html';
                    }, 3000);
                }

            } catch (error) {
                console.error("Error al cargar círculos:", error);
                loadingOverlay.innerHTML = `Error crítico al cargar círculos. Revisa la consola.`;
                errorDisplay.textContent = 'Hubo un error al conectar con la base de datos.';
            }
        }

        // 5. Manejar el envío de la publicación
        window.handlePostSubmit = async function(e) {
            e.preventDefault();
            errorDisplay.textContent = '';
            successDisplay.textContent = '';

            if (!currentUser) {
                errorDisplay.textContent = 'Error: No estás logueado.';
                return;
            }

            const postText = document.getElementById('postText').value.trim();
            const circleTarget = circlesSelect.value; 

            if (!postText) {
                errorDisplay.textContent = 'La publicación no puede estar vacía.';
                return;
            }

            if (!circleTarget) {
                 errorDisplay.textContent = 'Debes seleccionar un Círculo de Influencia.';
                return;
            }

            try {
                // Crear el objeto de la publicación
                const newPost = {
                    userId: currentUser.uid,
                    username: currentUser.displayName || 'Usuario Nexus', // Usar el nombre guardado en Auth
                    text: postText,
                    circleTarget: circleTarget,
                    likes: 0,
                    commentsCount: 0,
                    createdAt: serverTimestamp() // Marca de tiempo del servidor
                };

                // Guardar la publicación en la colección 'posts'
                await addDoc(collection(db, "posts"), newPost);

                successDisplay.textContent = '¡Publicación enviada con éxito!';
                document.getElementById('postText').value = ''; // Limpiar textarea
                
                // Redirigir al feed después de un breve momento
                setTimeout(() => {
                    window.location.href = 'feed.html';
                }, 1500);


            } catch (error) {
                errorDisplay.textContent = 'Error al publicar. Revisa la consola.';
                console.error("Error creating post:", error);
            }
        }

        // 6. Verificar el estado de Autenticación al cargar la página
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('postForm').addEventListener('submit', handlePostSubmit);

            onAuthStateChanged(auth, (user) => {
                if (user) {
                    currentUser = user;
                    // El usuario está logueado, cargar sus círculos
                    loadCircles(user); 
                } else {
                    // El usuario NO está logueado, redirigir
                    alert("Debes iniciar sesión para crear publicaciones.");
                    window.location.href = 'login.html'; 
                }
            });
        });
    </script>
</head>
<body>

    <div class="container">
        
        <div id="loading-overlay">
            <h2>Crear Nueva Publicación</h2>
            Cargando Circles de Influencia...
        </div>

        <div id="form-content" style="display:none;">
            <h2>Crear Nueva Publicación</h2>
            <form id="postForm">
                
                <label for="circleTarget">Dirigido a Círculo de Influencia:</label>
                <select id="circleTarget" required>
                    <!-- Las opciones se llenarán con loadCircles() -->
                </select>

                <label for="postText">Tu Mensaje:</label>
                <textarea id="postText" placeholder="¿Qué estás pensando hoy? (Máx 280 caracteres)" maxlength="280" rows="4" required></textarea>
                
                <button type="submit">Publicar en Nexus</button>
            </form>
        </div>

        <p id="successMessage" class="success-message"></p>
        <p id="errorMessage" class="error-message"></p>
    </div>
</body>
</html>
