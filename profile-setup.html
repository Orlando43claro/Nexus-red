<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus | Configurar Perfil</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body { 
            font-family: 'Inter', sans-serif; margin: 0; background: linear-gradient(135deg, #0077b6, #00b4d8); 
            display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px;
        }
        .container { 
            background: white; padding: 40px; border-radius: 16px; max-width: 500px; width: 100%; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.2); text-align: center; position: relative;
        }
        h2 { color: #0077b6; margin-bottom: 8px; font-size: 2em; }
        p.subtitle { color: #555; margin-bottom: 30px; font-size: 1.1em; }
        label { display: block; text-align: left; margin-top: 20px; font-weight: 600; color: #333; }
        input, textarea { 
            width: 100%; padding: 14px; margin-top: 8px; border: 1px solid #ddd; border-radius: 10px; 
            box-sizing: border-box; font-size: 16px; transition: border 0.3s;
        }
        input:focus, textarea:focus { outline: none; border-color: #0077b6; box-shadow: 0 0 0 3px rgba(0,119,182,0.1); }
        textarea { resize: vertical; min-height: 110px; }
        small { color: #777; font-size: 0.9em; }
        button { 
            background-color: #0077b6; color: white; padding: 16px; border: none; border-radius: 10px; 
            cursor: pointer; width: 100%; margin-top: 30px; font-weight: bold; font-size: 1.1em;
            transition: background-color 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        button:hover { background-color: #005f93; }
        button:disabled { background-color: #aaa; cursor: not-allowed; }
        .success-message, .error-message { 
            margin-top: 20px; padding: 12px; border-radius: 8px; font-weight: 500; display: none;
        }
        .success-message { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error-message { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .preview { margin-top: 10px; font-size: 1.4em; color: #0077b6; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <h2>¡Bienvenido a Nexus!</h2>
        <p class="subtitle">Completa tu perfil para empezar a conectar</p>

        <form id="setupForm">
            <label for="username">Nombre de usuario</label>
            <input type="text" id="username" placeholder="ejemplo123" maxlength="20" required autocomplete="off">
            <small>Solo letras minúsculas, números y guiones bajos. No se puede cambiar fácilmente.</small>
            <div class="preview">@<span id="usernamePreview">elige tu usuario</span></div>

            <label for="bio">Biografía</label>
            <textarea id="bio" placeholder="Ej: Amante del café ☕ | Creador de #ViajesEnSolitario | Siempre aprendiendo" maxlength="200"></textarea>
            <small><span id="bioChars">0</span>/200 caracteres</small>

            <label for="firstCircleName">Tu primer Círculo de Influencia</label>
            <input type="text" id="firstCircleName" placeholder="Ej: Amigos Cercanos, Familia, Equipo de Trabajo" required>
            <small>Este será tu espacio privado por defecto</small>

            <button type="submit" id="submitBtn">
                <span id="btnText">Finalizar y Entrar a Nexus</span>
                <i class="fas fa-arrow-right" id="btnIcon"></i>
            </button>
        </form>

        <div id="successMessage" class="success-message">
            ¡Perfil creado con éxito! Redirigiendo al feed...
        </div>
        <div id="errorMessage" class="error-message"></div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-auth.js";
        import { 
            getFirestore, doc, setDoc, getDoc, collection, serverTimestamp 
        } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCaJWbunJFLn2iZLopx-4bsZa0DapE8whc",
            authDomain: "nexus-2c445.firebaseapp.com",
            projectId: "nexus-2c445",
            storageBucket: "nexus-2c445.firebasestorage.app",
            messagingSenderId: "601285349766",
            appId: "1:601285349766:web:b8c014910f82ebf2c45c07"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;

        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('setupForm');
            const usernameInput = document.getElementById('username');
            const usernamePreview = document.getElementById('usernamePreview');
            const bioInput = document.getElementById('bio');
            const bioChars = document.getElementById('bioChars');
            const errorDiv = document.getElementById('errorMessage');
            const successDiv = document.getElementById('successMessage');
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const btnIcon = document.getElementById('btnIcon');

            // Preview del username en tiempo real
            usernameInput.addEventListener('input', () => {
                const val = usernameInput.value.trim().toLowerCase().replace(/[^a-z0-9_]/g, '');
                usernameInput.value = val;
                usernamePreview.textContent = val || 'elige tu usuario';
            });

            // Contador de caracteres de bio
            bioInput.addEventListener('input', () => {
                bioChars.textContent = bioInput.value.length;
            });

            onAuthStateChanged(auth, (user) => {
                if (!user) {
                    window.location.href = 'login.html';
                } else {
                    currentUser = user;
                }
            });

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                errorDiv.style.display = 'none';
                successDiv.style.display = 'none';
                errorDiv.textContent = '';

                submitBtn.disabled = true;
                btnText.textContent = 'Creando tu perfil...';
                btnIcon.className = 'fas fa-spinner fa-spin';

                const username = usernameInput.value.trim();
                const bio = bioInput.value.trim();
                const circleName = document.getElementById('firstCircleName').value.trim() || "Mi Círculo Cercano";

                // Validaciones
                if (!username || username.length < 3) {
                    showError('El usuario debe tener al menos 3 caracteres');
                    resetButton();
                    return;
                }
                if (!/^[a-z0-9_]+$/.test(username)) {
                    showError('Solo letras minúsculas, números y guiones bajos');
                    resetButton();
                    return;
                }

                try {
                    // 1. Verificar si el username ya existe
                    const usernameDoc = await getDoc(doc(db, "usernames", username));
                    if (usernameDoc.exists()) {
                        showError('Este nombre de usuario ya está en uso');
                        resetButton();
                        return;
                    }

                    // 2. Crear el primer círculo
                    const circleRef = doc(collection(db, "circles"));
                    await setDoc(circleRef, {
                        name: circleName,
                        creatorId: currentUser.uid,
                        isPrivate: true,
                        memberIds: [currentUser.uid],
                        createdAt: serverTimestamp()
                    });

                    // 3. Crear perfil del usuario
                    await setDoc(doc(db, "users", currentUser.uid), {
                        username,
                        usernameLower: username.toLowerCase(),
                        email: currentUser.email || null,
                        bio: bio || "Nuevo en Nexus",
                        circleIds: [circleRef.id],
                        profilePictureUrl: `https://placehold.co/100x100/0077b6/white?text=${username[0].toUpperCase()}`,
                        followersCount: 0,
                        followingCount: 0,
                        createdAt: serverTimestamp(),
                        lastSeen: serverTimestamp()
                    });

                    // 4. Reservar el username
                    await setDoc(doc(db, "usernames", username), {
                        uid: currentUser.uid
                    });

                    // ¡ÉXITO!
                    successDiv.style.display = 'block';
                    setTimeout(() => {
                        window.location.href = 'feed.html';
                    }, 1800);

                } catch (error) {
                    console.error("Error al crear perfil:", error);
                    showError('Error inesperado. Inténtalo más tarde.');
                    resetButton();
                }
            });

            function showError(msg) {
                errorDiv.textContent = msg;
                errorDiv.style.display = 'block';
            }

            function resetButton() {
                submitBtn.disabled = false;
                btnText.textContent = 'Finalizar y Entrar a Nexus';
                btnIcon.className = 'fas fa-arrow-right';
            }
        });
    </script>
</body>
</html>
