<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus | Configurar Perfil</title>
    <style>
        /* Estilos Mínimos y Responsivos */
        body { 
            font-family: sans-serif; margin: 0; background-color: #f0f2f5; 
            display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; padding: 20px;
        }
        .container { 
            background-color: white; padding: 30px; border-radius: 12px; 
            max-width: 500px; width: 100%; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.1); 
            text-align: center;
        }
        h2 { color: #0077b6; margin-bottom: 5px; }
        p { color: #555; margin-bottom: 30px; }
        label { display: block; text-align: left; margin-top: 15px; font-weight: bold; color: #333; }
        textarea, input[type="text"] { 
            width: 100%; padding: 12px; margin-top: 5px; 
            border: 1px solid #ddd; border-radius: 8px; 
            box-sizing: border-box; font-size: 16px;
        }
        textarea { resize: vertical; min-height: 100px; }
        button { 
            background-color: #28a745; /* Verde para acción de guardar/finalizar */
            color: white; padding: 14px 20px; 
            border: none; border-radius: 8px; cursor: pointer; 
            width: 100%; margin-top: 25px; font-weight: bold; 
            transition: background-color 0.3s;
        }
        button:hover { background-color: #1e7e34; }
        button:disabled { background-color: #a7f3d0; cursor: not-allowed; }
        .error-message { color: #d9534f; margin-top: 15px; font-weight: 500; }
        .info-message { color: #0077b6; margin-bottom: 20px; }
    </style>

    <!-- 1. Carga de SDKs de Firebase (Auth y Firestore) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInWithCustomToken, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-auth.js";
        // Importamos runTransaction para crear el usuario y el círculo atómicamente
        import { getFirestore, doc, serverTimestamp, runTransaction, setLogLevel } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-firestore.js";
        
        // Habilitar logs para depuración
        setLogLevel('debug');

        let app;
        let auth;
        let db;
        let currentUser = null; 

        const setupForm = document.getElementById('setupForm');
        const errorDisplay = document.getElementById('errorMessage');
        const finishButton = document.querySelector('button[type="submit"]');

        // Función para mostrar errores en la UI
        function showUIError(message) {
            errorDisplay.textContent = message;
            finishButton.disabled = false;
            finishButton.textContent = 'Finalizar y Entrar a Nexus';
        }

        // --- INICIALIZACIÓN DE FIREBASE Y AUTH ---
        async function initializeAppAndAuth() {
             let firebaseConfig = {};
             let initialAuthToken = null;
             
             // 1. Obtener la configuración de forma robusta del entorno
             try {
                if (window.__firebase_config) {
                    firebaseConfig = JSON.parse(window.__firebase_config);
                }
                if (window.__initial_auth_token) {
                    initialAuthToken = window.__initial_auth_token;
                }
             } catch (e) {
                 console.error("Error al parsear variables globales:", e);
                 showUIError("Error de configuración inicial: Variables de Firebase no válidas.");
                 return;
             }
             
             // 2. Inicializar Firebase
             if (Object.keys(firebaseConfig).length === 0 || !firebaseConfig.apiKey) {
                 showUIError("Error interno: Configuración de Firebase no encontrada. Recarga la página.");
                 return;
             }

             app = initializeApp(firebaseConfig);
             db = getFirestore(app);
             auth = getAuth(app);
             
             // 3. Autenticar usando el token o de forma anónima
             try {
                if (initialAuthToken) {
                    await signInWithCustomToken(auth, initialAuthToken);
                } else {
                    await signInAnonymously(auth); 
                }
             } catch (e) {
                 console.error("Error de autenticación inicial:", e);
                 showUIError("Error de autenticación. Por favor, reinicia la sesión.");
                 return;
             }

             // 4. Verificar el estado de Autenticación
             onAuthStateChanged(auth, (user) => {
                if (user) {
                    currentUser = user;
                    console.log("Usuario autenticado. UID:", user.uid);
                    // Mostrar el nombre de usuario
                    document.getElementById('welcome-message').textContent = `Bienvenido, @${user.displayName || 'nuevo usuario'}!`;
                } else {
                    // Si el usuario no está logueado, lo enviamos de vuelta al inicio de sesión
                    showUIError("Sesión no encontrada. Redirigiendo a login...");
                    setTimeout(() => window.location.href = 'login.html', 1500); 
                }
             });
        }

        document.addEventListener('DOMContentLoaded', initializeAppAndAuth);

        // 5. Manejar el envío del formulario para guardar datos en Firestore
        setupForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorDisplay.textContent = '';
            
            if (!currentUser || !db) {
                showUIError('Error: Sesión no encontrada o base de datos no inicializada.');
                return;
            }

            finishButton.disabled = true;
            finishButton.textContent = 'Guardando perfil...';

            const bio = document.getElementById('bio').value.trim();
            const firstCircleName = document.getElementById('firstCircleName').value.trim();
            const userId = currentUser.uid;

            // La lógica de guardado debe usar runTransaction y la ruta correcta para la subcolección privada
            const appId = window.__app_id || 'default-app-id';
            const userRef = doc(db, "users", userId);
            const circleId = firstCircleName.toLowerCase().replace(/\s+/g, '-'); 
            // Ruta del Círculo: /artifacts/{appId}/users/{userId}/circles/{circleId}
            const circleRef = doc(db, "artifacts", appId, "users", userId, "circles", circleId); 


            try {
                await runTransaction(db, async (transaction) => {
                    
                    // A. Crear el documento de perfil principal en 'users'
                    transaction.set(userRef, {
                        userId: userId,
                        username: currentUser.displayName || userId,
                        email: currentUser.email,
                        bio: bio,
                        // Almacenamos la referencia al primer círculo creado
                        defaultCircleId: circleId,
                        defaultCircleName: firstCircleName,
                        profilePictureUrl: 'https://placehold.co/100x100/CCCCCC/fff?text=N', 
                        createdAt: serverTimestamp(),
                        followersCount: 0,
                        followingCount: 0,
                    });

                    // B. Crear el documento del primer Círculo de Influencia (en la subcolección)
                    transaction.set(circleRef, {
                        name: firstCircleName,
                        id: circleId,
                        isPublic: false, 
                        ownerId: userId,
                        members: [userId], 
                        createdAt: serverTimestamp()
                    });
                });

                // Éxito: Redirigir al Feed (feed.html) sin alerta.
                finishButton.textContent = '¡Perfil configurado! Entrando...';
                window.location.href = 'feed.html';

            } catch (error) {
                console.error("Error al guardar en Firestore:", error);
                // Mostrar el error en la UI, no con alert
                showUIError('Error al guardar el perfil. Revisa la consola para más detalles.');
            }
        });
    </script>
</head>
<body>

    <div class="container">
        <h2 id="welcome-message">Configuración de Perfil</h2>
        <p class="info-message">¡Es el último paso! Crea tu biografía y define tu primer Círculo de Influencia para empezar a usar Nexus.</p>

        <form id="setupForm">
            
            <label for="bio">Biografía (Cuéntale al mundo quién eres):</label>
            <textarea id="bio" placeholder="Ej: Viajero digital, amante del café y creador del Círculo #ViajesEnSolitario." maxlength="200" required></textarea>

            <label for="firstCircleName">Nombre de tu Primer Círculo de Influencia:</label>
            <input type="text" id="firstCircleName" placeholder="Ej: Amigos Cercanos, Familia, Proyectos de Trabajo" required>
            <small style="display: block; text-align: left; color: #888;">Este es el grupo donde compartirás tu contenido más privado o específico.</small>
            
            <button type="submit">Finalizar y Entrar a Nexus</button>
        </form>

        <p id="errorMessage" class="error-message"></p>
    </div>
</body>
</html>
