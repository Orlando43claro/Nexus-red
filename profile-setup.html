<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuración de Perfil - Nexus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { 
            background-color: white; 
            padding: 30px; 
            border-radius: 16px; 
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1); 
            width: 90%; 
            max-width: 450px; 
            text-align: center;
        }
        .input-group { text-align: left; margin-bottom: 20px; }
        .input-group label { display: block; font-weight: 600; color: #333; margin-bottom: 8px; font-size: 0.95rem; }
        .input-group textarea, .input-group input {
            width: 100%;
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            resize: none;
            transition: border-color 0.3s;
        }
        .input-group textarea:focus, .input-group input:focus { border-color: #0077b6; outline: none; }
        .btn-finish {
            background-color: #16a34a; /* Verde para finalizar */
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.3s;
            width: 100%;
        }
        .btn-finish:hover:not(:disabled) { background-color: #10803a; }
        .btn-finish:disabled { background-color: #a7f3d0; cursor: not-allowed; }
        .message-box { padding: 10px; border-radius: 8px; margin-top: 15px; font-weight: 600; }
        .error-message { background-color: #fee2e2; color: #dc2626; border: 1px solid #fca5a5; }
        .success-message { background-color: #d1fae5; color: #059669; border: 1px solid #a7f3d0; }
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, .3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            -webkit-animation: spin 1s ease-in-out infinite;
            margin-right: 8px;
        }
        @keyframes spin {
            to { -webkit-transform: rotate(360deg); }
        }
        @-webkit-keyframes spin {
            to { -webkit-transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="card">
        <h2 class="text-2xl font-bold text-gray-800 mb-3">Bienvenido, <span id="welcome-username" class="text-blue-600">...</span> !</h2>
        <p class="text-gray-600 mb-6" id="status-text">Cargando conexión a Nexus...</p>
        
        <form id="profile-setup-form" class="hidden">
            
            <div class="input-group">
                <label for="bio">Biografía (Máx. 150 caracteres):</label>
                <textarea id="bio" rows="3" placeholder="Diseñador, me gusta el arte y la IA..." maxlength="150" required></textarea>
            </div>
            
            <div class="input-group">
                <label for="circle-name">Nombre de tu Primer Círculo de Influencia:</label>
                <input type="text" id="circle-name" placeholder="Ej: Amigos de IA, Mi Comunidad Privada" maxlength="30" required>
                <p class="text-sm text-gray-500 mt-1">Este es el grupo donde compartirás tu contenido más privado o específico.</p>
            </div>

            <button type="submit" class="btn-finish" id="finish-btn">
                Finalizar y Entrar a Nexus
            </button>
            
            <div id="message-display"></div>
        </form>
        <div id="initial-loading-indicator">
             <span class="loading-spinner"></span> Esperando configuración...
        </div>
    </div>

    <!-- ****************************************************** -->
    <!-- INTEGRACIÓN CON FIREBASE Y LÓGICA DE LA APLICACIÓN -->
    <!-- ****************************************************** -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInWithCustomToken, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-auth.js";
        import { 
            getFirestore, doc, serverTimestamp, runTransaction, setLogLevel
        } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-firestore.js";

        setLogLevel('debug'); // Habilitar logs para depuración

        let app;
        let auth;
        let db;
        let currentUser = null;
        
        const welcomeUsernameEl = document.getElementById('welcome-username');
        const messageDisplay = document.getElementById('message-display');
        const setupForm = document.getElementById('profile-setup-form');
        const finishBtn = document.getElementById('finish-btn');
        const statusText = document.getElementById('status-text');
        const loadingIndicator = document.getElementById('initial-loading-indicator');
        
        let isFirebaseReady = false;

        // Función de retardo
        const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

        // Función para mostrar mensajes de error/éxito
        function displayMessage(message, isError = true) {
            console.error(`ERROR: ${message}`);
            loadingIndicator.classList.add('hidden');
            setupForm.classList.remove('hidden'); // Mostrar el formulario para mostrar el error
            messageDisplay.innerHTML = `<div class="message-box ${isError ? 'error-message' : 'success-message'}">${message}</div>`;
            finishBtn.disabled = false;
            finishBtn.textContent = 'Finalizar y Entrar a Nexus';
        }

        // --- INICIALIZACIÓN DE FIREBASE Y AUTH ---
        async function initializeFirebaseAndAuth() {
            let firebaseConfig = {};
            let initialAuthToken = null;
            let attempts = 0;
            const maxAttempts = 5;

            // Intentar cargar variables globales hasta que estén disponibles o se acaben los intentos
            while (attempts < maxAttempts) {
                attempts++;
                loadingIndicator.innerHTML = `<span class="loading-spinner"></span> Intentando conexión (${attempts}/${maxAttempts})...`;
                
                try {
                    // Acceso directo a window para mayor robustez
                    if (window.__firebase_config) {
                        firebaseConfig = JSON.parse(window.__firebase_config);
                    }
                    if (window.__initial_auth_token) {
                        initialAuthToken = window.__initial_auth_token;
                    }

                    // Si la configuración parece válida, salir del bucle
                    if (Object.keys(firebaseConfig).length > 0 && firebaseConfig.apiKey) {
                        break; 
                    }
                } catch (e) {
                     console.warn(`Intento ${attempts} fallido al parsear config:`, e);
                }
                
                if (attempts < maxAttempts) {
                    await sleep(500); // Esperar 500ms antes de reintentar
                }
            }

            // 2. Verificar y Inicializar Firebase después de los intentos
            if (Object.keys(firebaseConfig).length > 0 && firebaseConfig.apiKey) {
                app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
                isFirebaseReady = true;
                console.log("Firebase inicializado correctamente.");
            } else {
                 displayMessage("Error interno: Configuración de Firebase no encontrada después de varios intentos. Las variables globales no fueron inyectadas.", true);
                 return;
            }

            // 3. Autenticación (o Anónima si no hay token)
            try {
                if (initialAuthToken) {
                    await signInWithCustomToken(auth, initialAuthToken);
                } else {
                    await signInAnonymously(auth); 
                }
                console.log("Autenticación inicial completada.");
            } catch (e) {
                console.error("Error de autenticación inicial:", e);
                displayMessage(`Error de autenticación inicial. Intente recargar. (Detalle: ${e.message})`, true);
                return;
            }

            // 4. Listener de estado de autenticación
            onAuthStateChanged(auth, (user) => {
                if (user) {
                    currentUser = user;
                    // Mostrar username o ID si displayname no está disponible
                    const username = user.displayName || user.uid.substring(0, 8) || "Usuario Anónimo";
                    welcomeUsernameEl.textContent = `@${username}`;
                    
                    // Ocultar el indicador de carga y mostrar el formulario
                    loadingIndicator.classList.add('hidden');
                    setupForm.classList.remove('hidden');
                    statusText.textContent = "¡Es el último paso! Crea tu biografía y define tu primer Círculo de Influencia para empezar a usar Nexus.";
                    
                    console.log(`Usuario autenticado: ${user.uid}, DisplayName: ${user.displayName}`);

                } else {
                    // Si el usuario no está logueado o la sesión expiró, redirigir
                    window.location.href = 'login.html';
                }
            });
        }
        
        document.addEventListener('DOMContentLoaded', initializeFirebaseAndAuth);

        // --- FUNCIÓN PRINCIPAL DE GUARDADO ---
        setupForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            if (!isFirebaseReady || !currentUser) {
                displayMessage("Error: La conexión a Nexus no está lista. Espere un momento e inténtelo de nuevo.", true);
                return;
            }

            finishBtn.disabled = true;
            finishBtn.innerHTML = '<span class="loading-spinner"></span> Guardando perfil...';
            messageDisplay.textContent = ''; 

            const bio = document.getElementById('bio').value.trim();
            const circleName = document.getElementById('circle-name').value.trim();
            const userId = currentUser.uid;
            
            if (bio.length < 5 || circleName.length < 3) {
                displayMessage("Asegúrate de que la biografía tenga al menos 5 caracteres y el nombre del círculo 3.", true);
                return;
            }

            // 1. Referencias de los documentos
            const userRef = doc(db, "users", userId);
            const circleId = circleName.toLowerCase().replace(/\s+/g, '-'); 
            // Ruta privada para los círculos del usuario
            const circleRef = doc(db, "artifacts", window.__app_id || 'default-app-id', "users", userId, "circles", circleId); 

            try {
                // Ejecutar Transacción para asegurar la atomicidad de la creación de usuario y círculo
                await runTransaction(db, async (transaction) => {
                    
                    // A. Crear el documento principal del usuario
                    transaction.set(userRef, {
                        userId: userId,
                        username: currentUser.displayName,
                        bio: bio,
                        createdAt: serverTimestamp(),
                        followersCount: 0,
                        followingCount: 0,
                        defaultCircleId: circleId,
                        defaultCircleName: circleName 
                    });

                    // B. Crear el documento del primer Círculo de Influencia (subcolección privada)
                    transaction.set(circleRef, {
                        name: circleName,
                        id: circleId,
                        isPublic: false, 
                        ownerId: userId,
                        members: [userId], 
                        createdAt: serverTimestamp()
                    });
                });

                // Éxito: Redirigir automáticamente al feed
                finishBtn.textContent = '¡Éxito! Entrando...';
                window.location.href = 'index.html'; 

            } catch (error) {
                console.error("Error completo al guardar el perfil (Transacción fallida):", error);
                
                if (error.code && error.code.includes('permission-denied')) {
                     displayMessage(`Error de Permisos: La regla de seguridad está bloqueando la escritura. Asegúrate de que las reglas para 'users/{userId}' y 'artifacts/{appId}/users/{userId}/circles/{circleId}' permitan 'write' si 'request.auth != null'.`, true);
                } else {
                    displayMessage(`Error al guardar el perfil. Intenta de nuevo. (Detalle: ${error.message})`, true);
                }
            }
        });
    </script>
</body>
</html>
