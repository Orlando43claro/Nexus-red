<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus | Perfil de Usuario</title>
    <style>
        body { 
            font-family: sans-serif; margin: 0; background-color: #f0f2f5; 
            display: flex; justify-content: center; align-items: flex-start; 
            min-height: 100vh; padding: 30px 20px;
        }
        .profile-container { 
            background-color: white; padding: 40px; border-radius: 12px; 
            max-width: 450px; width: 100%; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.1); 
            text-align: center; 
        }
        .avatar { 
            width: 120px; height: 120px; background-color: #ccc; 
            border-radius: 50%; margin: 0 auto 20px; 
            display: flex; justify-content: center; align-items: center;
            font-size: 40px; color: white; font-weight: bold;
        }
        h2 { color: #0077b6; margin-bottom: 5px; font-size: 1.8em; }
        .bio { color: #555; margin-bottom: 30px; line-height: 1.4; }
        .section-title { 
            border-bottom: 2px solid #0077b6; padding-bottom: 5px; 
            margin-top: 30px; margin-bottom: 20px; font-weight: bold; 
            color: #333; font-size: 1.1em;
        }
        .circle-item {
            background-color: #e0f7fa; color: #0077b6; padding: 8px 15px; 
            border-radius: 20px; display: inline-block; margin: 5px; 
            font-size: 0.9em; font-weight: 600;
        }
        .circle-item.private {
            background-color: #ffead1; color: #cc6600;
        }
        .action-button { 
            background-color: #d9534f; color: white; padding: 12px 20px; 
            border: none; border-radius: 8px; cursor: pointer; 
            width: 100%; margin-top: 20px; font-weight: bold; 
            transition: background-color 0.3s;
        }
        .action-button:hover { background-color: #c9302c; }

        /* Botón de Seguir/Dejar de Seguir */
        #follow-unfollow-btn {
            background-color: #28a745; margin-top: 15px; width: auto; 
            padding: 10px 25px; font-size: 1em; display: none;
        }
        #follow-unfollow-btn.unfollow {
            background-color: #ff9900;
        }
    </style>

    <!-- 1. Carga de SDKs de Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, deleteDoc, serverTimestamp, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-firestore.js";
        
        // 2. Configuración de Firebase (Tus Credenciales)
        const firebaseConfig = {
            apiKey: "AIzaSyCaJWbunJFLn2iZLopx-4bsZa0DapE8whc",
            authDomain: "nexus-2c445.firebaseapp.com",
            projectId: "nexus-2c445",
            storageBucket: "nexus-2c445.firebasestorage.app",
            messagingSenderId: "601285349766",
            appId: "1:601285349766:web:b8c014910f82ebf2c45c07"
        };

        // 3. Inicializar Firebase y Servicios
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null; // Usuario logueado (Yo)
        let targetUserId = null; // El UID del perfil que estamos viendo

        const urlParams = new URLSearchParams(window.location.search);
        const externalUid = urlParams.get('uid');

        // Referencias del DOM
        const profileContainer = document.getElementById('profile-container');
        const logoutButton = document.getElementById('logout-button');
        const followButton = document.getElementById('follow-unfollow-btn');


        // Función para cargar los datos del perfil
        async function loadProfileData(uid) {
            try {
                const userDocRef = doc(db, "users", uid);
                const userDoc = await getDoc(userDocRef);

                if (userDoc.exists()) {
                    const userData = userDoc.data();
                    
                    // Mostrar datos
                    document.getElementById('avatar-initial').textContent = userData.username ? userData.username.charAt(1) : 'U';
                    document.getElementById('username-display').textContent = `@${userData.username || 'Usuario Desconocido'}`;
                    document.getElementById('bio-display').textContent = userData.bio || 'Sin biografía.';

                    // Mostrar Círculos
                    const circlesContainer = document.getElementById('circles-display');
                    circlesContainer.innerHTML = '';
                    if (userData.circles && userData.circles.length > 0) {
                        userData.circles.forEach(circle => {
                            const isPrivate = circle.isPrivate ? 'private' : '';
                            const icon = circle.isPrivate ? '🔒' : '🌎';
                            circlesContainer.innerHTML += `<span class="circle-item ${isPrivate}">${icon} ${circle.name} (${circle.membersCount} Miembro)</span>`;
                        });
                    } else {
                        circlesContainer.innerHTML = '<p style="color:#888;">No ha creado círculos aún.</p>';
                    }

                } else {
                    profileContainer.innerHTML = '<p style="color:red; text-align:center;">Perfil no encontrado.</p>';
                }
            } catch (error) {
                console.error("Error al cargar datos del perfil:", error);
                profileContainer.innerHTML = '<p style="color:red; text-align:center;">Error crítico al cargar el perfil.</p>';
            }
        }
        
        // 5. Lógica de Seguir/Dejar de Seguir (Similar a la de feed.html)
        window.handleFollow = async function() {
            if (!currentUser || !targetUserId) return;

            const followerRef = doc(db, "users", currentUser.uid, "following", targetUserId);
            const followingRef = doc(db, "users", targetUserId, "followers", currentUser.uid);

            try {
                const followDoc = await getDoc(followerRef);

                if (followDoc.exists()) {
                    // YA SIGUE -> DEJAR DE SEGUIR
                    await deleteDoc(followerRef);
                    await deleteDoc(followingRef);
                } else {
                    // NO SIGUE -> SEGUIR
                    await setDoc(followerRef, { userId: targetUserId, timestamp: serverTimestamp() });
                    await setDoc(followingRef, { userId: currentUser.uid, timestamp: serverTimestamp() });
                }
            } catch (error) {
                console.error("Error al seguir/dejar de seguir:", error);
                alert("Error de seguimiento.");
            }
        }

        // Listener para actualizar el botón de Seguir/Dejar de Seguir
        function setupFollowButtonListener() {
             if (currentUser && targetUserId && currentUser.uid !== targetUserId) {
                 followButton.style.display = 'inline-block';
                 const followerRef = doc(db, "users", currentUser.uid, "following", targetUserId);

                 onSnapshot(followerRef, (docSnapshot) => {
                     if (docSnapshot.exists()) {
                         followButton.textContent = 'Dejar de Seguir';
                         followButton.classList.add('unfollow');
                     } else {
                         followButton.textContent = 'Seguir';
                         followButton.classList.remove('unfollow');
                     }
                 });
             } else {
                 followButton.style.display = 'none'; // Ocultar si es el propio perfil o no hay usuario
             }
        }

        // Función de Cerrar Sesión
        window.handleLogout = async function() {
            try {
                await signOut(auth);
                alert("Sesión cerrada correctamente.");
                window.location.href = 'login.html'; 
            } catch (error) {
                console.error("Error al cerrar sesión:", error);
                alert("No se pudo cerrar la sesión.");
            }
        }

        // 6. Verificar estado de autenticación al cargar
        document.addEventListener('DOMContentLoaded', () => {
            onAuthStateChanged(auth, (user) => {
                if (user) {
                    currentUser = user;

                    if (externalUid && externalUid !== user.uid) {
                        // Viendo perfil de otro usuario
                        targetUserId = externalUid;
                        logoutButton.style.display = 'none'; // Ocultar cerrar sesión en perfil ajeno
                        document.title = `Nexus | Perfil de ${targetUserId}`;
                    } else {
                        // Viendo mi propio perfil (o 'profile.html' sin uid)
                        targetUserId = user.uid;
                        logoutButton.style.display = 'block'; 
                        logoutButton.addEventListener('click', handleLogout);
                        document.title = `Nexus | Mi Perfil`;
                    }
                    
                    // Cargar los datos del perfil objetivo
                    loadProfileData(targetUserId); 
                    // Configurar el botón de seguir/dejar de seguir
                    setupFollowButtonListener(); 

                } else {
                    // Si no está logueado, redirigir al login
                    alert("Debes iniciar sesión para ver perfiles. Redirigiendo...");
                    window.location.href = 'login.html'; 
                }
            });
        });
    </script>
</head>
<body>

    <div class="profile-container" id="profile-container">
        <div class="avatar">
            <span id="avatar-initial">U</span>
        </div>
        
        <h2 id="username-display">@Cargando...</h2>
        <p class="bio" id="bio-display">Cargando biografía...</p>

        <!-- Botón de Seguir/Dejar de Seguir (Visible si es un perfil ajeno) -->
        <button id="follow-unfollow-btn" class="action-button" onclick="handleFollow()">Seguir</button>
        
        <div class="section-title">Círculos de Influencia Creados</div>
        <div id="circles-display">
            Cargando círculos...
        </div>
        
        <!-- Botón de Cerrar Sesión (Visible solo en el propio perfil) -->
        <button id="logout-button" class="action-button">Cerrar Sesión</button>
        
        <p style="margin-top: 20px;"><a href="feed.html">Volver al Feed</a></p>
    </div>
</body>
</html>
