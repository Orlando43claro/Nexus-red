<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus | Perfil de Usuario</title>
    <style>
        /* Estilos Generales */
        body { font-family: sans-serif; margin: 0; background-color: #f0f2f5; }
        .header { background-color: #0077b6; color: white; padding: 10px; text-align: center; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { margin: 0; font-size: 1.5em; }
        .header nav a { color: white; text-decoration: none; padding: 5px 10px; border-radius: 5px; transition: background-color 0.3s; }
        .header nav a:hover { background-color: #005f93; }

        /* Contenedor Principal del Perfil */
        .profile-container { 
            background-color: white; margin: 20px auto; padding: 25px; 
            border-radius: 12px; max-width: 600px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
            text-align: center; 
        }

        /* Información del Perfil */
        .profile-info h2 { color: #333; margin-bottom: 5px; }
        .profile-info p { color: #555; margin-top: 0; font-size: 0.9em; }
        
        /* NUEVO: Indicador de Estado */
        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: #ccc; /* Gris para Desconectado/Desconocido */
            border: 2px solid white;
            box-shadow: 0 0 0 1px #888;
            margin-left: 10px;
        }
        .online {
            background-color: #28a745; /* Verde para Activo */
            box-shadow: 0 0 0 1px #28a745;
        }

        /* Botones de Acción */
        .action-buttons button {
            background-color: #ff9900; color: white; border: none; padding: 10px 20px;
            border-radius: 6px; margin: 5px; cursor: pointer; font-size: 1em;
            transition: background-color 0.2s;
        }
        .action-buttons button:hover { background-color: #cc7a00; }
        .btn-danger { background-color: #dc3545 !important; }
        .btn-danger:hover { background-color: #c82333 !important; }
        .btn-secondary { 
            background-color: #6c757d !important;
            padding: 8px 15px; margin-left: 10px;
        }
        .btn-secondary:hover { background-color: #5a6268 !important; }


        /* Barra de Estadísticas de Seguimiento */
        .stats-bar {
            display: flex; justify-content: space-around;
            padding: 15px 0; margin: 20px 0; border-top: 1px solid #eee; 
            border-bottom: 1px solid #eee;
        }
        .stats-bar button {
            background: none; border: none; cursor: pointer;
            color: #0077b6; font-size: 1.1em; font-weight: bold;
            display: flex; flex-direction: column; align-items: center;
        }
        .stats-bar button:hover { text-decoration: underline; }
        .stats-bar span { 
            font-size: 1.5em; color: #333; font-weight: 700; 
            margin-bottom: 4px;
        }

        /* Área de Publicaciones */
        #user-posts { margin-top: 20px; text-align: left; }
        .post-card { 
            background-color: #f8f9fa; padding: 15px; margin-bottom: 10px; 
            border-radius: 8px; border-left: 5px solid #0077b6;
        }
        .post-card p { margin: 0; color: #333; }
        .post-card small { display: block; margin-top: 5px; color: #888; }


        /* Estilos de Modal (Comunes para todos) */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.7); justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-content {
            background-color: white; padding: 30px; border-radius: 10px;
            text-align: center; max-width: 400px; width: 90%; 
        }

        /* Estilos para la lista de usuarios en el modal */
        .user-list-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 8px 0; border-bottom: 1px solid #eee;
        }
        .user-list-item a {
            color: #0077b6; font-weight: bold; text-decoration: none;
        }
        .user-list-item a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <header class="header">
        <h1>NEXUS</h1>
        <nav>
            <a href="feed.html">Feed</a>
            <a href="create-post.html">Crear Publicación</a>
        </nav>
    </header>

    <main>
        <div id="profile-container" class="profile-container">
            <div id="profile-info" class="profile-info">
                <!-- ESTRUCTURA ACTUALIZADA: Nombre de usuario con indicador de estado -->
                <div style="display: flex; align-items: center; justify-content: center;">
                    <h2 id="profile-username">Cargando Perfil...</h2>
                    <div id="online-status-indicator" class="status-indicator" title="Estado"></div>
                </div>
                <p id="profile-bio">...</p>
            </div>
            
            <!-- BARRA DE ESTADÍSTICAS -->
            <div class="stats-bar">
                <button id="followers-btn" onclick="showFollowListModal('followers')">
                    <span id="followers-count">0</span> Seguidores
                </button>
                <button id="following-btn" onclick="showFollowListModal('following')">
                    <span id="following-count">0</span> Siguiendo
                </button>
            </div>

            <div id="action-buttons" class="action-buttons">
                <p>Cargando botones de acción...</p>
            </div>

            <h3 style="text-align: left; margin-top: 30px;">Publicaciones</h3>
            <div id="user-posts">
                <p style="color: #888;">Cargando publicaciones...</p>
            </div>
        </div>
    </main>

    <!-- Modal 1: Edición de Perfil -->
    <div id="edit-modal" class="modal" onclick="closeModal(event, 'edit-modal')">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h3>Editar Perfil</h3>
            <label for="edit-username">Nombre de Usuario:</label>
            <input type="text" id="edit-username" style="width: 100%; padding: 8px; margin-bottom: 10px;">
            <label for="edit-bio">Biografía:</label>
            <textarea id="edit-bio" rows="4" style="width: 100%; padding: 8px; resize: vertical;"></textarea>
            <button onclick="saveProfileChanges()" style="background-color: #28a745; color: white; padding: 10px; border-radius: 5px; margin-top: 10px;">Guardar Cambios</button>
            <button class="btn-secondary" onclick="closeModal(null, 'edit-modal')">Cancelar</button>
        </div>
    </div>
    
    <!-- Modal 2: Lista de Seguidores/Siguiendo -->
    <div id="list-modal" class="modal" onclick="closeModal(event, 'list-modal')">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h3 id="list-modal-title">Lista de Usuarios</h3>
            <div id="user-list-content" style="text-align: left; max-height: 40vh; overflow-y: auto; padding: 10px 0;">
                <p style="text-align: center;">Cargando lista...</p>
            </div>
            <button style="margin-top: 20px;" class="btn-secondary" onclick="closeModal(null, 'list-modal')">Cerrar</button>
        </div>
    </div>
    
    <!-- Modal 3: Confirmación de Cierre de Sesión -->
    <div id="logout-confirm-modal" class="modal" onclick="closeModal(event, 'logout-confirm-modal')">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h3>¿Cerrar Sesión?</h3>
            <p>Estás seguro de que quieres cerrar la sesión actual de Nexus?</p>
            <button class="btn-danger" onclick="confirmLogout()">Sí, Cerrar Sesión</button>
            <button class="btn-secondary" onclick="closeModal(null, 'logout-confirm-modal')">Cancelar</button>
        </div>
    </div>


    <!-- ****************************************************** -->
    <!-- INTEGRACIÓN CON FIREBASE Y LÓGICA DE PERFIL DINÁMICO -->
    <!-- ****************************************************** -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-auth.js";
        import { 
            getFirestore, doc, getDoc, updateDoc, 
            collection, query, where, getDocs, onSnapshot,
            setDoc, deleteDoc, serverTimestamp // <-- serverTimestamp importado para tracking
        } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-firestore.js";
        
        // Configuración de Firebase (Tus Credenciales)
        const firebaseConfig = {
            apiKey: "AIzaSyCaJWbunJFLn2iZLopx-4bsZa0DapE8whc",
            authDomain: "nexus-2c445.firebaseapp.com",
            projectId: "nexus-2c445",
            storageBucket: "nexus-2c445.firebasestorage.app",
            messagingSenderId: "601285349766",
            appId: "1:601285349766:web:b8c014910f82ebf2c45c07"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let profileUserId = null; // ID del usuario cuyo perfil estamos viendo
        let profileUserData = {}; // Datos del usuario del perfil

        const urlParams = new URLSearchParams(window.location.search);
        
        // Elementos UI
        const profileInfoDiv = document.getElementById('profile-info');
        const actionButtonsDiv = document.getElementById('action-buttons');
        const userPostsDiv = document.getElementById('user-posts');
        const listModal = document.getElementById('list-modal');
        const listModalTitle = document.getElementById('list-modal-title');
        const userListContent = document.getElementById('user-list-content');
        const logoutConfirmModal = document.getElementById('logout-confirm-modal');
        const followersCountSpan = document.getElementById('followers-count');
        const followingCountSpan = document.getElementById('following-count');
        const onlineStatusIndicator = document.getElementById('online-status-indicator'); // <-- NUEVO


        // Función para cerrar cualquier modal
        window.closeModal = function(event, modalId) {
            const modal = document.getElementById(modalId);
            if (!event || event.target === modal || (event && event.currentTarget === modal)) {
                modal.style.display = 'none';
            }
        }
        
        // ******************************************************
        // LÓGICA DE PRESENCIA Y ESTADO ACTIVO (NUEVO)
        // ******************************************************

        // Función para actualizar el estado de presencia del usuario actual
        function updatePresence() {
            if (currentUser) {
                try {
                    const userRef = doc(db, "users", currentUser.uid);
                    // Solo actualizamos 'lastSeen'. El resto de campos se mantiene.
                    updateDoc(userRef, {
                        lastSeen: serverTimestamp()
                    }).catch(err => console.error("Error al actualizar lastSeen:", err));
                } catch (error) {
                    console.error("Error al actualizar presencia (updatePresence):", error);
                }
            }
        }

        // Función para verificar y mostrar el estado de actividad del perfil visitado
        function checkAndDisplayStatus(userData) {
            const lastSeen = userData.lastSeen;
            const now = Date.now();
            const activeThreshold = 60 * 1000; // Considerar "Activo" si la última actividad fue hace 60 segundos o menos
            let isOnline = false;

            if (lastSeen) {
                // Convertir el Timestamp de Firebase a milisegundos
                const lastSeenTime = lastSeen.toDate ? lastSeen.toDate().getTime() : (lastSeen.seconds * 1000) + (lastSeen.nanoseconds / 1000000); 
                
                if (now - lastSeenTime < activeThreshold) {
                    isOnline = true;
                }
            }

            onlineStatusIndicator.classList.remove('online');
            onlineStatusIndicator.title = "Desconectado";

            if (isOnline) {
                onlineStatusIndicator.classList.add('online');
                onlineStatusIndicator.title = "Activo ahora";
            } else if (lastSeen) {
                // Opcional: Mostrar cuándo fue la última vez que estuvo activo si está "desconectado"
                onlineStatusIndicator.title = `Últ. vez activo: ${new Date(lastSeen.toDate()).toLocaleTimeString()}`;
            }
        }


        // ******************************************************
        // LÓGICA DE SEGUIMIENTO Y LISTAS (MANTENIDA)
        // ******************************************************
        function setupFollowListeners(userId) {
            // Listener de Seguidores (Followers)
            const followersRef = collection(db, "users", userId, "followers");
            onSnapshot(followersRef, (snapshot) => {
                followersCountSpan.textContent = snapshot.size;
            }, (error) => {
                console.error("Error al obtener seguidores:", error);
            });

            // Listener de Siguiendo (Following)
            const followingRef = collection(db, "users", userId, "following");
            onSnapshot(followingRef, (snapshot) => {
                followingCountSpan.textContent = snapshot.size;
            }, (error) => {
                console.error("Error al obtener siguiendo:", error);
            });
        }
        
        async function fetchUsername(userId) {
            try {
                const userDoc = await getDoc(doc(db, "users", userId));
                return userDoc.exists() ? userDoc.data().username : 'Usuario Desconocido';
            } catch (e) {
                console.error("Error fetching username:", e);
                return 'Usuario Desconocido';
            }
        }

        window.showFollowListModal = async function(type) {
            listModalTitle.textContent = type === 'followers' ? 'Lista de Seguidores' : 'Lista de Siguiendo';
            userListContent.innerHTML = '<p style="text-align: center;">Cargando...</p>';
            listModal.style.display = 'flex';

            const collectionName = type === 'followers' ? 'followers' : 'following';
            const usersRef = collection(db, "users", profileUserId, collectionName);

            try {
                const snapshot = await getDocs(usersRef);
                userListContent.innerHTML = '';
                
                if (snapshot.empty) {
                    userListContent.innerHTML = `<p style="text-align: center; color:#888;">No hay usuarios en esta lista.</p>`;
                    return;
                }
                
                const usernamePromises = [];

                snapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    let targetUserId;
                    
                    if (collectionName === 'followers') {
                        targetUserId = data.userId || docSnap.id;
                    } else {
                        targetUserId = docSnap.id;
                    }
                    
                    if (data.username) {
                        usernamePromises.push(Promise.resolve({ userId: targetUserId, username: data.username }));
                    } else {
                        usernamePromises.push(fetchUsername(targetUserId).then(username => ({ userId: targetUserId, username: username })));
                    }
                });
                
                const userList = await Promise.all(usernamePromises);

                userList.forEach((user) => {
                     userListContent.innerHTML += `
                        <div class="user-list-item">
                            <a href="profile.html?uid=${user.userId}" onclick="closeModal(null, 'list-modal')">@${user.username}</a>
                        </div>
                    `;
                });
                
            } catch (error) {
                console.error(`Error al cargar lista de ${type}:`, error);
                userListContent.innerHTML = `<p style="text-align: center; color:red;">Error al cargar la lista.</p>`;
            }
        }

        window.handleFollow = async function() {
            if (!currentUser) return;

            const isFollowing = actionButtonsDiv.querySelector('#follow-btn').textContent === 'Siguiendo';
            const followerRef = doc(db, "users", currentUser.uid, "following", profileUserId);
            const followingRef = doc(db, "users", profileUserId, "followers", currentUser.uid);

            try {
                // Obtener el nombre de usuario del usuario actual para el registro del seguidor
                const currentUserDoc = await getDoc(doc(db, "users", currentUser.uid));
                const currentUsername = currentUserDoc.exists() ? currentUserDoc.data().username : 'Usuario Nexus';

                if (isFollowing) {
                    await deleteDoc(followerRef);
                    await deleteDoc(followingRef);
                } else {
                    await setDoc(followerRef, { userId: profileUserId, username: profileUserData.username });
                    await setDoc(followingRef, { userId: currentUser.uid, username: currentUsername });
                }
            } catch (error) {
                console.error("Error al seguir/dejar de seguir:", error);
            }
        }


        // ******************************************************
        // LÓGICA DE CIERRE DE SESIÓN (MANTENIDA)
        // ******************************************************
        window.showLogoutModal = function() {
            logoutConfirmModal.style.display = 'flex';
        }

        window.confirmLogout = async function() {
            logoutConfirmModal.style.display = 'none';
            try {
                await signOut(auth);
                window.location.href = 'login.html'; 
            } catch (error) {
                console.error("Error al cerrar sesión:", error);
            }
        }

        // ******************************************************
        // LÓGICA DE RENDERIZADO PRINCIPAL (MODIFICADA)
        // ******************************************************
        
        // 1. Carga los datos del perfil (usa onSnapshot para el estado activo en tiempo real)
        let profileDocListener = null;

        function loadProfileData() {
            if (!profileUserId) {
                profileInfoDiv.innerHTML = '<h2>Error: ID de usuario no especificado.</h2>';
                userPostsDiv.innerHTML = '';
                return;
            }
            
            // Si ya hay un listener, lo desuscribimos primero
            if (profileDocListener) {
                profileDocListener();
            }

            const userRef = doc(db, "users", profileUserId);
            
            // Usamos onSnapshot para escuchar cambios en el documento, incluyendo 'lastSeen'
            profileDocListener = onSnapshot(userRef, (userDoc) => {
                if (!userDoc.exists()) {
                    profileInfoDiv.innerHTML = '<h2>Usuario no encontrado.</h2>';
                    return;
                }
                
                // Actualizar los datos del perfil
                profileUserData = userDoc.data();
                
                // 1. Actualizar el UI del perfil (Nombre y Bio)
                document.getElementById('profile-username').textContent = profileUserData.username || `Usuario Nexus`;
                document.getElementById('profile-bio').textContent = profileUserData.bio || 'Sin biografía.';

                // 2. Verificar y mostrar el estado de actividad (NUEVO)
                checkAndDisplayStatus(profileUserData);

                // 3. Renderizar botones de acción y publicaciones
                renderActionButtons();
                setupFollowListeners(profileUserId); // Se mantiene el listener de contadores

                // Cargamos publicaciones solo una vez al iniciar la vista
                if (!window._postsLoaded) { 
                    loadUserPosts();
                    window._postsLoaded = true;
                }
                
            }, (error) => {
                console.error("Error al cargar datos del perfil:", error);
                profileInfoDiv.innerHTML = '<h2>Error al cargar el perfil.</h2>';
            });
        }

        // 2. Renderiza los botones de acción (MANTENIDA)
        function renderActionButtons() {
            actionButtonsDiv.innerHTML = '';
            
            if (!currentUser) {
                 actionButtonsDiv.innerHTML = '<p style="color:#888;">Inicia sesión para interactuar.</p>';
                 return;
            }

            if (currentUser.uid === profileUserId) {
                actionButtonsDiv.innerHTML = `
                    <button onclick="showEditModal()">Editar Perfil</button>
                    <button class="btn-danger" onclick="showLogoutModal()">Cerrar Sesión</button>
                `;
            } else {
                const followerRef = doc(db, "users", currentUser.uid, "following", profileUserId);
                
                onSnapshot(followerRef, (docSnapshot) => {
                    const isFollowing = docSnapshot.exists();
                    const buttonText = isFollowing ? 'Siguiendo' : 'Seguir';
                    const buttonClass = isFollowing ? 'follow-button following' : 'follow-button';
                    
                    actionButtonsDiv.innerHTML = `
                        <button id="follow-btn" class="${buttonClass}" onclick="handleFollow()">${buttonText}</button>
                    `;
                }, (error) => {
                    console.error("Error al escuchar estado de seguimiento:", error);
                });
            }
        }

        // 3. Carga las publicaciones del perfil (MANTENIDA)
        async function loadUserPosts() {
            userPostsDiv.innerHTML = '<p style="color: #888;">Cargando publicaciones...</p>';
            try {
                const postsQuery = query(
                    collection(db, "posts"), 
                    where("userId", "==", profileUserId)
                );
                
                let querySnapshot = await getDocs(postsQuery);
                let posts = [];
                querySnapshot.forEach(doc => posts.push({ id: doc.id, ...doc.data() }));

                // Ordenar localmente por 'createdAt' (descendente)
                posts.sort((a, b) => {
                    const timeA = a.createdAt ? (a.createdAt.seconds * 1000) + (a.createdAt.nanoseconds / 1000000) : 0;
                    const timeB = b.createdAt ? (b.createdAt.seconds * 1000) + (b.createdAt.nanoseconds / 1000000) : 0;
                    return timeB - timeA;
                });
                
                userPostsDiv.innerHTML = '';

                if (posts.length === 0) {
                    userPostsDiv.innerHTML = '<p>Este usuario aún no tiene publicaciones.</p>';
                    return;
                }

                posts.forEach((post) => {
                    const formattedDate = post.createdAt ? new Date(post.createdAt.seconds * 1000).toLocaleDateString() : 'Fecha desconocida';
                    userPostsDiv.innerHTML += `
                        <div class="post-card">
                            <p>${post.text}</p>
                            <small>Publicado: ${formattedDate} | Likes: ${post.likes || 0} | Círculo: ${post.circleTarget || 'Global'}</small>
                        </div>
                    `;
                });

            } catch (error) {
                console.error("Error al cargar publicaciones:", error);
                userPostsDiv.innerHTML = '<p style="color: red;">Error al cargar las publicaciones del usuario.</p>';
            }
        }

        // 4. Lógica de edición de perfil (MANTENIDA)
        window.showEditModal = function() {
            document.getElementById('edit-username').value = profileUserData.username || '';
            document.getElementById('edit-bio').value = profileUserData.bio || '';
            document.getElementById('edit-modal').style.display = 'flex';
        }

        window.saveProfileChanges = async function() {
            const newUsername = document.getElementById('edit-username').value.trim();
            const newBio = document.getElementById('edit-bio').value.trim();
            
            if (!newUsername) {
                console.error("El nombre de usuario no puede estar vacío.");
                return;
            }

            try {
                await updateDoc(doc(db, "users", currentUser.uid), {
                    username: newUsername,
                    bio: newBio
                });
                
                closeModal(null, 'edit-modal');
                // loadProfileData se actualizará automáticamente gracias a onSnapshot
            } catch (error) {
                console.error("Error al guardar cambios:", error);
            }
        }

        // ******************************************************
        // INICIO DE LA APLICACIÓN
        // ******************************************************
        document.addEventListener('DOMContentLoaded', () => {
            onAuthStateChanged(auth, (user) => {
                if (user) {
                    currentUser = user;
                    // Determinar el perfil a mostrar
                    profileUserId = urlParams.get('uid') || currentUser.uid;
                    
                    // 1. Iniciar seguimiento de presencia para el usuario actual
                    updatePresence(); 
                    // 2. Establecer actualización periódica (cada 30 segundos)
                    setInterval(updatePresence, 30000); 

                    // 3. Cargar los datos del perfil (con listener de estado)
                    loadProfileData();

                } else {
                    // Si no está logueado, redirigir al login
                    window.location.href = 'login.html';
                }
            });
        });
    </script>
</body>
</html>
