<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus – Crear cuenta</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body{background:#f0f2f5;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;}
    .card{background:white;padding:40px;width:90%;max-width:400px;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,0.1);text-align:center;}
    .logo{font-size:42px;font-weight:900;color:#1877f2;margin-bottom:30px;}
    input,button{width:100%;padding:14px;margin:10px 0;border-radius:8px;border:1px solid #ddd;font-size:16px;}
    .btn-google{background:#fff;border:1px solid #ddd;cursor:pointer;font-weight:600;}
    .btn-register{background:#42b72a;color:white;border:none;cursor:pointer;font-weight:600;}
    .or{margin:20px 0;color:#888;position:relative;}
    .or::before{content:'';position:absolute;top:50%;left:0;right:0;height:1px;background:#ddd;}
    .or span{background:white;padding:0 15px;}
    .link{color:#1877f2;cursor:pointer;font-weight:600;}
    .loading{display:none;color:#42b72a;margin-top:10px;font-weight:600;}
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">NEXUS</div>
    <h2 style="margin-bottom:20px;color:#1c1e21;">Crea tu cuenta gratis</h2>

    <button id="googleBtn" class="btn-google">
      Registrarse con Google
    </button>

    <div class="or"><span>o</span></div>

    <input type="text" id="nombre" placeholder="Nombre completo (opcional)">
    <input type="email" id="email" placeholder="Correo electrónico" required>
    <input type="password" id="password" placeholder="Contraseña (mín. 6 caracteres)" required>

    <button id="registerBtn" class="btn-register">Crear cuenta</button>

    <div class="loading" id="loading">Creando tu cuenta...</div>
    <div id="error" style="color:#e74c3c;margin-top:10px;"></div>

    <p style="margin-top:25px;font-size:14px;">
      ¿Ya tienes cuenta? <span class="link" onclick="location.href='login.html'">Iniciar sesión</span>
    </p>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, createUserWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCaJWbunJFLn2iZLopx-4bsZa0DapE8whc",
      authDomain: "nexus-2c445.firebaseapp.com",
      projectId: "nexus-2c445",
      storageBucket: "nexus-2c445.firebasestorage.app",
      messagingSenderId: "601285349766",
      appId: "1:601285349766:web:b8c014910f82ebf2c45c07"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // Registro con Google
    document.getElementById("googleBtn").onclick = async () => {
      document.getElementById("loading").style.display = "block";
      const provider = new GoogleAuthProvider();
      try {
        await signInWithPopup(auth, provider);
        location.href = "index.html";
      } catch (err) {
        document.getElementById("error").textContent = "Error con Google";
        document.getElementById("loading").style.display = "none";
      }
    };

    // Registro con email
    document.getElementById("registerBtn").onclick = async () => {
      const nombre = document.getElementById("nombre").value.trim();
      const email = document.getElementById("email").value.trim();
      const pass = document.getElementById("password").value;

      if (!email || !pass) return document.getElementById("error").textContent = "Completa email y contraseña";
      if (pass.length < 6) return document.getElementById("error").textContent = "Contraseña muy corta (mín. 6)";

      document.getElementById("loading").style.display = "block";
      document.getElementById("error").textContent = "";

      try {
        const cred = await createUserWithEmailAndPassword(auth, email, pass);
        // Guardar nombre (si puso uno)
        await updateProfile(cred.user, { 
          displayName: nombre || email.split("@")[0] 
        });
        location.href = "index.html";
      } catch (err) {
        const msg = err.code === "auth/email-already-in-use" ? "Este correo ya está registrado" :
                    err.code === "auth/weak-password" ? "Contraseña muy débil" : "Error al crear cuenta";
        document.getElementById("error").textContent = msg;
        document.getElementById("loading").style.display = "none";
      }
    };
  </script>
</body>
</html>
