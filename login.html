<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus – Iniciar sesión</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body{background:#f0f2f5;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;}
    .card{background:white;padding:40px;width:90%;max-width:400px;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,0.1);text-align:center;}
    .logo{font-size:42px;font-weight:900;color:#1877f2;margin-bottom:30px;}
    input,button{width:100%;padding:14px;margin:10px 0;border-radius:8px;border:1px solid #ddd;font-size:16px;}
    .btn-google{background:#fff;border:1px solid #ddd;cursor:pointer;}
    .btn-login{background:#1877f2;color:white;border:none;cursor:pointer;}
    .or{margin:20px 0;color:#888;position:relative;}
    .or::before{content:'';position:absolute;top:50%;left:0;right:0;height:1px;background:#ddd;}
    .or span{background:white;padding:0 15px;}
    .link{color:#1877f2;cursor:pointer;font-weight:600;}
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">NEXUS</div>
    <button id="googleBtn" class="btn-google">Continuar con Google</button>
    <div class="or"><span>o</span></div>
    <input type="email" id="email" placeholder="Correo electrónico">
    <input type="password" id="password" placeholder="Contraseña">
    <button id="loginBtn" class="btn-login">Iniciar sesión</button>
    <p>¿No tienes cuenta? <span class="link" onclick="location.href='register.html'">Regístrate</span></p>
    <div id="error" style="color:#e74c3c;margin-top:10px;"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

    const app = initializeApp({ /* misma config que arriba */ });
    const auth = getAuth(app);

    document.getElementById("googleBtn").onclick = () => signInWithPopup(auth, new GoogleAuthProvider()).then(() => location.href = "index.html");
    document.getElementById("loginBtn").onclick = () => {
      const email = document.getElementById("email").value;
      const pass = document.getElementById("password").value;
      signInWithEmailAndPassword(auth, email, pass)
        .then(() => location.href = "index.html")
        .catch(err => document.getElementById("error").textContent = "Usuario o contraseña incorrectos");
    };
  </script>
</body>
</html>
